name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  validate_schemas:
    timeout-minutes: 10
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        # For pipenv this must run BEFORE pipenv is installed (poetry is the
        # opposite). See actions/setup-python docs/advanced-usage.md.
        cache: 'pipenv'

    - name: Install pipenv
      run: |
        python -m pip install --upgrade pip
        pip install pipenv

    - name: Install dependencies
      # --deploy fails on a stale lock instead of silently re-resolving.
      run: pipenv install --dev --deploy

    - name: Run pre-commit checks
      uses: pre-commit/action@v3.0.1

    - name: Run tests with pytest
      run: pipenv run pytest

