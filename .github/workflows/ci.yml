name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  validate_schemas:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        # Caches the pipenv virtualenv, keyed on Pipfile.lock. Note the ordering:
        # for pipenv, setup-python must run BEFORE pipenv is installed (the
        # opposite of poetry, which must be installed first). See
        # actions/setup-python docs/advanced-usage.md.
        cache: 'pipenv'

    - name: Install pipenv
      run: |
        python -m pip install --upgrade pip
        pip install pipenv

    - name: Install dependencies
      # --deploy: fail loudly if Pipfile.lock is out of sync with Pipfile instead
      # of silently re-resolving. Without it CI ignored the committed lock entirely.
      run: pipenv install --dev --deploy

    - name: Run pre-commit checks
      uses: pre-commit/action@v3.0.1

    - name: Run tests with pytest
      run: pipenv run pytest

